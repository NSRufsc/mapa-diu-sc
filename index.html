<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Regiões Geográficas Intermediárias de SC</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100vh;
      background: #e5e5e5;
    }

    .tooltip-regiao {
      background: rgba(0,0,0,0.75);
      color: #fff;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 13px;
      border: none;
      box-shadow: none;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Seu JS -->
  <script src="mapa.js"></script>
</body>
</html>
